plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // 数据生成器的输出
    srcDir('src/generated/resources')

    // 只在开发时使用的文件不进成品
    exclude('**/*.bbmodel') // Blockbench 工程文件
    exclude('src/generated/**/.cache') // 数据生成缓存
}

repositories {
    // JEI 和它的设置库
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    // Jade、Sodium、Iris：Modrinth 的 Maven 接口
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

base {
    // 成品文件名带上 MC 版本，例如 universe-26.3-0.0.1.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

// 26.3 给玩家分发的是 Java 25，模组也以 Java 25 为目标
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 兼容测试（ADR-0019）：-Pcompat=jei,jade,sodium,iris 选哪些模组跟着开发客户端一起加载；不写时都不加载，
// 平常的开发运行和无头验收不受影响。兼容代码编译时总能看到 JEI 和 Jade 的接口。
var compatMods = (project.findProperty('compat') ?: '').toString().split(',').collect { it.trim() }.findAll { it } as Set

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 调试用：./gradlew runClient -PquickPlay="New World" 跳过标题界面直接进入存档
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            // 无头验收用：./gradlew runClient -PdevScript=<脚本> 进存档后按脚本自动操作、截图（client/dev/DevScript）
            if (project.hasProperty('devScript')) {
                systemProperty 'universe.devScript', file(project.property('devScript').toString()).getAbsolutePath()
            }
            // Iris 1.11.7 给光影包建的渲染管线过不了开发环境才开的渲染校验，开着光影包第一帧就崩；
            // 装 Iris 时关掉这层校验，和玩家的环境一样
            if (compatMods.contains('iris')) {
                systemProperty 'neoforge.disableBlaze3DValidation', 'true'
            }
        }

        // 多人测试用的第二个客户端：游戏目录是 run2，用户名固定为 Dev2。
        // ./gradlew runClient2 -PjoinServer=localhost:25599 启动后直接连主机（主机在开发脚本里用 lan 25599 开放）
        client2 {
            client()
            gameDirectory = project.file('run2')
            programArguments.addAll '--username', 'Dev2'
            if (project.hasProperty('joinServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('joinServer').toString()
            }
            if (project.hasProperty('devScript')) {
                systemProperty 'universe.devScript', file(project.property('devScript').toString()).getAbsolutePath()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 启动 GameTestServer，跑完全部游戏内测试后退出（没有注册任何测试时会报错）
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 量性能（ADR-0038）：./gradlew runGameTestServer -PperfBench=<传送带>,<设备>,<化工设备>,<刻数>
            // 只跑参照基地这一项，分项计时的报告写进 run/logs/latest.log（Perf: 开头）
            if (project.hasProperty('perfBench')) {
                systemProperty 'universe.perfBench', project.property('perfBench').toString()
            }
        }

        // 数据生成：输出到 src/generated/resources
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // 日志标记：SCAN 模组扫描；REGISTRIES 注册事件；REGISTRYDUMP 输出全部注册表
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime：只在开发运行时加载、不写进发布依赖的模组（例如 JEI 完整包）
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // core 包的纯 Java 单元测试
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 读数据生成结果的测试（生存可达性）用；版本和 Minecraft 自带的一致
    testImplementation 'com.google.code.gson:gson:2.14.0'

    // 可选兼容：只编译，不打进成品、不写进依赖
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (compatMods.contains('jei')) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    if (compatMods.contains('jade')) {
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
    if (compatMods.contains('sodium') || compatMods.contains('iris')) {
        localRuntime "maven.modrinth:sodium:${sodium_version}"
    }
    if (compatMods.contains('iris')) {
        localRuntime "maven.modrinth:iris:${iris_version}"
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// 把 gradle.properties 里的属性展开到 src/main/templates 下的模板（neoforge.mods.toml）
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
// IDE 同步工程时也生成一次，免得手动跑任务
neoForge.ideSyncTask generateModMetadata

// 许可证随 jar 一起分发
var licenseSuffix = mod_id
tasks.named('jar', Jar).configure {
    from(files('LICENSE', 'LICENSE_ASSETS')) {
        rename { "${it}_${licenseSuffix}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA 默认不再自动下载依赖的源码和文档
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
