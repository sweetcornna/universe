# 模组元数据模板：占位符由 build.gradle 的 generateModMetadata 任务展开，取值见 gradle.properties
# 字段说明：https://docs.neoforged.net/docs/gettingstarted/modfiles

license="${mod_license}"
# 26.3 的 ModFileInfo 只读文件级的 issueTrackerURL，没有 displayURL；仓库地址写在发布页和 README 里
issueTrackerURL="https://github.com/sweetcornna/universe/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# 模组列表里的方形图标，由 tools/logo.py 生成（26.x 起 logoFile 已弃用，改用 iconFile / bannerFile）
iconFile="universe_logo.png"
description='''
从方块世界出发，驾驶飞船探索程序生成的星系，建设跨星球的自动化工业，最终在恒星周围建造戴森球。
Set out from the blocky world, fly your starship across procedurally generated star systems, build interplanetary factories and raise a Dyson sphere around a star.
'''

# 少量 Mixin，每一处都写明为什么不能用事件或数据包做（技术架构 §4）
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
