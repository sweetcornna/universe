name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # 改了数据生成却忘了提交 src/generated 时在这里报出来
      - name: Check generated resources
        run: |
          ./gradlew runData
          git status --porcelain src/generated
          test -z "$(git status --porcelain src/generated)"

      # 全部游戏内测试，跑完自己退出，不需要 EULA
      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore